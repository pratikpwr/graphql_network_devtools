name: graphql_network_devtools
description: >-
  Flutter DevTools extension to inspect GraphQL traffic: operation names,
  variables, responses, errors, headers, search and copy as cURL.
version: 0.2.0
homepage: https://github.com/pratikpwr/graphql_network_devtools
repository: https://github.com/pratikpwr/graphql_network_devtools
issue_tracker: https://github.com/pratikpwr/graphql_network_devtools/issues
documentation: https://github.com/pratikpwr/graphql_network_devtools#readme

topics:
  - graphql
  - devtools
  - network
  - debugging
  - inspector

screenshots:
  - description: GraphQL operations list with the response tree of the selected operation.
    path: screenshots/overview.png
  - description: Query tab with syntax highlighting, search and copy.
    path: screenshots/query.png
  - description: GraphQL errors and response details.
    path: screenshots/errors.png

environment:
  sdk: ^3.10.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
